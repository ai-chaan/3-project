<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI Facilitator - P2P完全修正版</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .setup-box { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; min-width: 400px; text-align: left;}
        .main-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .video-box { position: fixed; top: 10px; right: 10px; z-index: 1000; width: 200px; height: 150px; }
        video { display: none; }
        canvas { border: 2px solid #333; border-radius: 8px; transform: scaleX(-1); width: 100%; height: auto; }
        .dashboard { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; text-align: left; margin: 0 auto;}
        .global-alert { font-size: 16px; color: #e74c3c; font-weight: bold; background: #fdebd0; padding: 15px; border-radius: 5px; margin-top: 10px; min-height: 40px; border-left: 5px solid #e74c3c;}
        .status-item { margin-bottom: 10px; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        input[type="text"] { padding: 8px; margin: 0 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;}
        button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%;}
        .mode-selector { margin: 15px 0; padding: 15px; background: #ecf0f1; border-radius: 5px;}
        .room-code-display { font-size: 24px; font-weight: bold; color: #2c3e50; letter-spacing: 2px; background: #fff; padding: 5px 10px; border-radius: 5px; display: inline-block;}
        .lonely-btn { background: #e74c3c; color: white; border: none; border-radius: 50%; width: 260px; height: 260px; font-size: 32px; font-weight: bold; cursor: pointer; box-shadow: 0 12px #c0392b; transition: all 0.1s; margin: 30px auto; display: block; outline: none; }
        .lonely-btn:active { box-shadow: 0 4px #c0392b; transform: translateY(8px); }
        .lonely-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(231, 76, 60, 0.9); color: white; z-index: 9999; justify-content: center; align-items: center; flex-direction: column; font-size: 48px; font-weight: bold; }
        #seat-map { width: 400px; height: 320px; background: #e0e0e0; position: relative; margin: 20px auto; border: 5px solid #bdc3c7; }
        .seat { width: 40px; height: 40px; border-radius: 4px; position: absolute; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; cursor: move; user-select: none; }
        .seat.me { background: #3498db; cursor: default; }
        .seat.other { background: #2ecc71; }
        .seat-label { position: absolute; bottom: -20px; width: 100px; left: -30px; color: #333; text-align: center; white-space: nowrap; }
    </style>
</head>
<body>

    <div id="lonely-overlay" class="lonely-overlay">
        <div>📢 <span id="lonely-user-name">誰か</span>が寂しいよ！</div>
        <div style="font-size: 24px; margin-top: 20px;">会話に入れていない人がいます</div>
        <button onclick="hideLonelyOverlay()" style="margin-top: 30px; background: white; color: #e74c3c; width: 200px;">閉じる</button>
    </div>

    <h1 style="text-align: center;">🤖 チームファシリテーター (P2P通信)</h1>

    <div style="text-align: center;">
        <div class="setup-box" id="setup-area">
            <div style="margin-bottom: 15px;">
                <b>あなたの名前:</b> <input type="text" id="my-name" value="Aさん">
            </div>

            <div class="mode-selector">
                <label><input type="radio" name="mode" value="host" checked onchange="toggleMode()"> <b>ルームを作る (親機)</b></label><br>
                <label><input type="radio" name="mode" value="guest" onchange="toggleMode()"> <b>ルームに参加する (子機)</b></label>
                
                <div id="host-panel" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ccc;">
                    あなたの招待コード: <br>
                    <span class="room-code-display" id="generated-code"></span>
                </div>

                <div id="guest-panel" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ccc; display: none;">
                    ホストから聞いた招待コードを入力:<br>
                    <input type="text" id="join-code" placeholder="例: ABCD" style="text-transform: uppercase;">
                </div>
            </div>
            
            <h3>🪑 座席配置</h3>
            <p style="font-size: 12px; color:#666;">グリッド内をクリックして参加者を追加し、ドラッグで位置を調整してください。</p>
            <div id="seat-map">
                <div class="seat me" id="seat-me" style="bottom: 0px; left: 160px;">私<div class="seat-label" id="my-name-label">Aさん</div></div>
            </div>
            <button onclick="startSystem()">システム開始</button>
        </div>
    </div>

    <div class="main-container" id="main-area" style="display: none;">
        <div class="video-box">
            <video id="video" width="640" height="480" autoplay playsinline></video>
            <canvas id="output_canvas" width="640" height="480"></canvas>
            <div id="role-badge" style="position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.7); color:white; padding:5px 10px; border-radius:5px; font-weight:bold; font-size:12px;"></div>
        </div>

        <div class="dashboard">
            <h3>📊 あなたの状況</h3>
            <div class="status-item" id="my-direction">視線: 判定中...</div>
            <div class="status-item" id="my-audio" style="border-bottom: none;">発言量: 判定中...</div>
            
            <h3>📩 AIからのアドバイス</h3>
            <div class="global-alert" id="parent-command-alert">AIが会話のバランスを分析中です...</div>

            <button class="lonely-btn" id="lonely-trigger" onclick="sendLonelyAlert()">寂しいよ...</button>
        </div>
    </div>

    <script>
        let myName = "", myRole = "child", activeRoomCode = "";
        let isSpeaking = false, currentLookTarget = "正面", currentFaceRatio = 0.5;
        let speakDurationSeconds = 0, lookDurationSeconds = 0, lastLookTarget = "正面";
        let registeredTargets = [{ name: "正面", ratio: 0.5 }];
        
        const seatMap = document.getElementById('seat-map'); 
        const myNameInput = document.getElementById('my-name');
        const myNameLabel = document.getElementById('my-name-label'); 
        const seatMe = document.getElementById('seat-me');
        let otherSeats = [];

        function generateRoomCode() { return Math.random().toString(36).substring(2, 6).toUpperCase(); }
        document.getElementById('generated-code').innerText = generateRoomCode();
        
        function toggleMode() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            document.getElementById('host-panel').style.display = mode === 'host' ? 'block' : 'none';
            document.getElementById('guest-panel').style.display = mode === 'guest' ? 'block' : 'none';
        }

        // --- 座席配置ドラッグ実装 ---
        let draggingElement = null; let dragOffsetX = 0; let dragOffsetY = 0;
        function setupDraggable(el) {
            el.addEventListener('mousedown', (e) => {
                draggingElement = el; const rect = el.getBoundingClientRect();
                dragOffsetX = e.clientX - rect.left; dragOffsetY = e.clientY - rect.top;
                el.style.zIndex = 1000; e.stopPropagation();
            });
        }
        setupDraggable(seatMe);
        
        window.addEventListener('mousemove', (e) => {
            if (!draggingElement) return; const rect = seatMap.getBoundingClientRect();
            let nx = e.clientX - rect.left - dragOffsetX; let ny = e.clientY - rect.top - dragOffsetY;
            nx = Math.max(0, Math.min(rect.width - 40, nx)); ny = Math.max(0, Math.min(rect.height - 40, ny));
            draggingElement.style.left = nx + 'px'; draggingElement.style.top = ny + 'px';
        });
        window.addEventListener('mouseup', () => { if (draggingElement) { draggingElement.style.zIndex = ""; draggingElement = null; } });

        seatMap.addEventListener('click', (e) => {
            if (e.target !== seatMap) return; const name = prompt("参加者の名前を入力してください:"); if (!name) return;
            const rect = seatMap.getBoundingClientRect(); const seat = document.createElement('div');
            seat.className = 'seat other'; seat.style.left = (e.clientX - rect.left - 20) + 'px'; seat.style.top = (e.clientY - rect.top - 20) + 'px';
            seat.innerText = name[0]; const label = document.createElement('div'); label.className = 'seat-label'; label.innerText = name;
            seat.appendChild(label); seatMap.appendChild(seat); setupDraggable(seat); otherSeats.push({ name, element: seat });
        });

        function calculateRatio(element) {
            const meX = seatMe.offsetLeft + 20; const meY = seatMe.offsetTop + 20;
            const targetX = element.offsetLeft + 20; const targetY = element.offsetTop + 20;
            let angle = Math.atan2(targetX - meX, -(targetY - meY));
            let ratio = 0.5 + (Math.sin(angle) * 0.5); 
            return Math.max(0, Math.min(1, ratio));
        }

        async function startSystem() {
            myName = myNameInput.value; 
            const mode = document.querySelector('input[name="mode"]:checked').value;
            
            if (mode === 'host') { 
                myRole = 'parent'; 
                activeRoomCode = document.getElementById('generated-code').innerText; 
            } else { 
                activeRoomCode = document.getElementById('join-code').value.toUpperCase(); 
                myRole = 'child'; 
                if (!activeRoomCode) return alert("招待コードを入力してください"); 
            }
            
            otherSeats.forEach(s => registeredTargets.push({ name: s.name, ratio: calculateRatio(s.element) }));
            document.getElementById('setup-area').style.display = 'none'; document.getElementById('main-area').style.display = 'block';
            document.getElementById('role-badge').innerText = `ルーム: ${activeRoomCode} (${myRole === 'parent' ? '👑 ホスト' : '👤 ゲスト'})`;
            
            initPeerJS(); startDurationTimer(); await initAudio(); initFaceMesh();
        }

        function startDurationTimer() {
            setInterval(() => {
                if (isSpeaking) speakDurationSeconds++; else speakDurationSeconds = 0;
                if (currentLookTarget !== "正面" && currentLookTarget === lastLookTarget) lookDurationSeconds++; else lookDurationSeconds = 0;
                lastLookTarget = currentLookTarget;
            }, 1000);
        }

        // ==========================================
        // ★ PeerJS (P2P) 関連の実装 ★
        // ==========================================
        let peer;
        let connections = {}; // ホスト用: { guestPeerId: conn }
        let hostConn; // ゲスト用: ホストへの接続

        function initPeerJS() {
            // ルームコードをPeerIDとして使用（親機）または接続先として使用（子機）
            const peerId = myRole === 'parent' ? `room-${activeRoomCode}` : null;
            peer = new Peer(peerId, {
                debug: 2
            });

            peer.on('open', (id) => {
                console.log('My peer ID is: ' + id);
                if (myRole === 'child') {
                    // ホストに接続
                    const conn = peer.connect(`room-${activeRoomCode}`, {
                        metadata: { name: myName }
                    });
                    setupConnection(conn);
                }
            });

            peer.on('connection', (conn) => {
                console.log('Incoming connection from: ' + conn.peer);
                setupConnection(conn);
            });

            peer.on('error', (err) => {
                console.error('PeerJS error:', err);
                if (err.type === 'peer-unavailable') {
                    alert('ルームが見つかりません。招待コードが正しいか、ホストが開始しているか確認してください。');
                }
            });

            // 定期的な状態送信
            setInterval(() => {
                const myPayload = { 
                    type: 'state_update', 
                    name: myName, 
                    peerId: peer.id,
                    payload: { 
                        name: myName, 
                        lookingAt: currentLookTarget, 
                        speaking: isSpeaking, 
                        speakDuration: speakDurationSeconds, 
                        lookDuration: lookDurationSeconds 
                    } 
                };

                if (myRole === 'parent') {
                    // 自分自身の状態を分析に含める
                    handleIncomingData(myPayload);
                } else if (hostConn && hostConn.open) {
                    hostConn.send(myPayload);
                }
            }, 500);
        }

        function setupConnection(conn) {
            if (myRole === 'parent') {
                conn.on('data', (data) => handleIncomingData(data));
                conn.on('open', () => {
                    connections[conn.peer] = conn;
                    console.log('Connected to guest: ' + (conn.metadata?.name || conn.peer));
                });
                conn.on('close', () => {
                    console.log('Connection closed: ' + conn.peer);
                    delete connections[conn.peer];
                    const nameToRemove = Object.keys(hostGlobalState).find(name => hostGlobalState[name].peerId === conn.peer);
                    if (nameToRemove) delete hostGlobalState[nameToRemove];
                });
                conn.on('error', (err) => {
                    console.error('Connection error:', err);
                    delete connections[conn.peer];
                });
            } else {
                hostConn = conn;
                conn.on('data', (data) => handleIncomingData(data));
                conn.on('open', () => {
                    console.log('Connected to host');
                });
                conn.on('close', () => {
                    console.log('Host connection closed');
                    alert("ホストとの接続が切れました。ページを更新して再接続してください。");
                });
                conn.on('error', (err) => {
                    console.error('Host connection error:', err);
                });
            }
        }

        let hostGlobalState = {}; 

        function handleIncomingData(msg) {
            console.log("Received P2P Message:", msg);
            if (msg.type === 'state_update') {
                if (myRole === 'parent') {
                    hostGlobalState[msg.name] = { ...msg.payload, peerId: msg.peerId };
                    const users = Object.values(hostGlobalState);
                    analyzeGlobalStateAndCommand(users); 
                }
            } 
            else if (msg.type === 'parent_command') {
                if (msg.target === myName || msg.target === 'all') {
                    document.getElementById('parent-command-alert').innerText = msg.message;
                }
            }
            else if (msg.type === 'lonely_alert') {
                if (myRole === 'parent') {
                    // ホストが受信したら全ゲストに転送（自分以外）
                    broadcastToGuests(msg);
                    if (msg.from !== myName) showLonelyOverlay(msg.from);
                } else {
                    if (msg.from !== myName) showLonelyOverlay(msg.from);
                }
            }
        }

        function broadcastToGuests(msgObj) {
            if (myRole !== 'parent') return;
            Object.values(connections).forEach(conn => {
                if (conn.open) {
                    conn.send(msgObj);
                }
            });
        }

        function sendLonelyAlert() { 
            console.log("Sending Lonely Alert...");
            const msg = { type: 'lonely_alert', from: myName };
            if (myRole === 'parent') {
                handleIncomingData(msg); 
                broadcastToGuests(msg); 
            } else if (hostConn && hostConn.open) {
                hostConn.send(msg); 
            } else {
                console.warn("Cannot send Lonely Alert: Not connected to host.");
                alert("親機に接続されていません。接続を待機中か、エラーが発生しています。");
            }
        }
        function showLonelyOverlay(name) { 
            document.getElementById('lonely-user-name').innerText = name || "誰か";
            document.getElementById('lonely-overlay').style.display = 'flex'; 
        }
        function hideLonelyOverlay() { document.getElementById('lonely-overlay').style.display = 'none'; }

        function analyzeGlobalStateAndCommand(users) {
            if (users.length < 2) return;
            let overSpeaker = users.find(u => u.speakDuration > 30); 
            if (overSpeaker) {
                const cmd = { type: 'parent_command', target: overSpeaker.name, message: overSpeaker.name === myName ? "📢 あなたは30秒以上お話しされています。他の方に話を振ってみましょう！" : `📢 ${overSpeaker.name}さん、30秒以上お話しされています。そろそろ他の方に話を振ってみましょう！` };
                handleIncomingData(cmd); 
                broadcastToGuests(cmd);
                return;
            }
            let overLooker = users.find(u => u.lookDuration >= 30);
            if (overLooker) { 
                const cmd = { type: 'parent_command', target: overLooker.name, message: `⚠️ 警告：${overLooker.lookingAt}さんを30秒以上見続けています。別の人にも顔を向けてみましょう。` };
                handleIncomingData(cmd); 
                broadcastToGuests(cmd);
                return; 
            }

            let isolatedUsers = [];
            users.forEach(u => {
                let isLookedAt = users.some(other => other.name !== u.name && other.lookingAt === u.name);
                if (!isLookedAt && !u.speaking) isolatedUsers.push(u.name);
            });
            if (isolatedUsers.length > 0) {
                let currentSpeaker = users.find(u => u.speaking);
                const cmd = { type: 'parent_command', target: currentSpeaker ? currentSpeaker.name : 'all', message: currentSpeaker ? `💡 ${isolatedUsers.join(', ')}さんが会話に入れていないようです。顔を向けてみましょう！` : `💡 ${isolatedUsers.join(', ')}さんに意見を聞いてみましょう！` };
                handleIncomingData(cmd); 
                broadcastToGuests(cmd);
            } else { 
                const cmd = { type: 'parent_command', target: 'all', message: "✨ 全員が参加できていて、良いバランスです！" };
                handleIncomingData(cmd); 
                broadcastToGuests(cmd);
            }
        }

        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser(); const microphone = audioContext.createMediaStreamSource(stream);
                analyser.fftSize = 256; microphone.connect(analyser); const dataArray = new Uint8Array(analyser.frequencyBinCount);
                function checkVolume() {
                    analyser.getByteFrequencyData(dataArray); let sum = 0; for(let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    isSpeaking = (sum / dataArray.length) > 20;
                    document.getElementById('my-audio').innerText = isSpeaking ? "発言量: 🗣️ 発言中" : "発言量: ---";
                    requestAnimationFrame(checkVolume);
                }
                checkVolume();
            } catch (err) { console.error(err); document.getElementById('my-audio').innerText = "マイクエラー"; }
        }

        function initFaceMesh() {
            const videoElement = document.getElementById('video'); const canvasElement = document.getElementById('output_canvas'); const canvasCtx = canvasElement.getContext('2d');
            const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
            faceMesh.onResults((results) => {
                canvasCtx.save(); canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                if (results.image) canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                    const landmarks = results.multiFaceLandmarks[0]; const nose = landmarks[1], leftEdge = landmarks[234], rightEdge = landmarks[454];
                    const noseRelativeX = (nose.x - rightEdge.x) / (leftEdge.x - rightEdge.x);
                    
                    const sensitivity = 2.5; 
                    currentFaceRatio = Math.max(0, Math.min(1, 0.5 + (noseRelativeX - 0.5) * sensitivity));
                    
                    let minDiff = 1.0;
                    registeredTargets.forEach(target => {
                        let diff = Math.abs(currentFaceRatio - target.ratio); if (target.name === "正面") diff *= 0.85;
                        if (diff < minDiff) { minDiff = diff; currentLookTarget = target.name; }
                    });
                    canvasCtx.fillStyle = "red"; [nose, leftEdge, rightEdge].forEach(pt => { canvasCtx.beginPath(); canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, 4, 0, 2 * Math.PI); canvasCtx.fill(); });
                    document.getElementById('my-direction').innerHTML = `視線: <b>${currentLookTarget}</b> を見ています`;
                }
                canvasCtx.restore();
            });
            const camera = new Camera(videoElement, { onFrame: async () => { await faceMesh.send({image: videoElement}); }, width: 640, height: 480 }); camera.start();
        }
    </script>
</body>
</html>
